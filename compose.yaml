services:
  estate-organiser:
    image: ghcr.io/dougalbob/estate-organiser:latest
    container_name: estate-organiser
    restart: unless-stopped
    ports:
      - "3005:3000"
    volumes:
      - /mnt/user/appdata/estate-organiser:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
